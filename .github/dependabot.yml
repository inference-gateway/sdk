---
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /examples/*
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
